<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap</title>
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      fill: #333;
    }

    .node {
      fill: #fff;
    }

    .node circle {
      stroke: steelblue;
      stroke-width: 3px;
    }

    .node text {
      fill: #333;
      font: 12px sans-serif;
    }

    .link {
      fill: none;
      stroke: #ccc;
      stroke-width: 2px;
    }

    .toggled {
      fill: orange;
    }

    .selected-node {
      stroke: #ff6600 !important;
      stroke-width: 4px !important;
    }

    svg {
      width: 99vw;
      height: 99vh;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(0, 0, 0, 0.1) 2px, transparent 2px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.1) 2px, transparent 2px);
      background-size:
        20px 20px,
        20px 20px,
        100px 100px,
        100px 100px;
    }

    .keybindings {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }

    .keybindings table {
      border-collapse: collapse;
    }

    .keybindings td {
      padding: 2px 6px;
    }

    .keybindings kbd {
      display: inline-block;
      padding: 1px 5px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 13px;
      color: white;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .toast.visible { opacity: 1; }
    .toast.ok  { background: #28a745; }
    .toast.err { background: #dc3545; }
    </style>
  </head>
  <body>
    <svg></svg>
    <div id="toast" class="toast"></div>
    <div class="keybindings">
      <table>
        <tr><td><kbd>h</kbd></td><td>go to parent</td></tr>
        <tr><td><kbd>l</kbd></td><td>go to first child</td></tr>
        <tr><td><kbd>j</kbd></td><td>next sibling</td></tr>
        <tr><td><kbd>k</kbd></td><td>prev sibling</td></tr>
        <tr><td><kbd>i</kbd></td><td>insert child</td></tr>
        <tr><td><kbd>o</kbd></td><td>insert sibling below</td></tr>
        <tr><td><kbd>r</kbd></td><td>rename</td></tr>
        <tr><td><kbd>x</kbd></td><td>delete node</td></tr>
        <tr><td><kbd>t</kbd></td><td>toggle done</td></tr>
        <tr><td><kbd>s</kbd></td><td>save</td></tr>
        <tr><td><kbd>c</kbd></td><td>invert colors</td></tr>
      </table>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
      let treeData;
      let params = new URLSearchParams(window.location.search);
      let idParam = params.get('id');
      let selectedNodeData = null;

      if (!idParam) {
        document.body.innerHTML = '<p style="padding:2rem;font-family:monospace">Missing <code>?id=</code> parameter. Usage: <code>/?id=my-roadmap</code></p>';
        throw new Error('Missing id parameter');
      }

      function initializeSVG(margin, width, height) {
        return d3.select("svg")
          .attr("width", width + margin.left + margin.right)
          .attr("height", height + margin.top + margin.bottom)
          .call(svg => svg.select("g").remove())
          .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);
      }

      function buildHierarchy() {
        const margin = { top: 100, right: 200, bottom: 100, left: 200 };
        const width = window.innerWidth - margin.left - margin.right;
        const height = window.innerHeight - margin.top - margin.bottom;
        const treemap = d3.tree().size([height, width]);
        return { nodes: treemap(d3.hierarchy(treeData)), margin, width, height };
      }

      function drawLinks(g, nodes) {
        g.selectAll(".link")
          .data(nodes.descendants().slice(1))
          .enter().append("path")
          .attr("class", "link")
          .attr("d", d => `
        M${d.y},${d.x}
        C${(d.y + d.parent.y) / 2},${d.x}
         ${(d.y + d.parent.y) / 2},${d.parent.x}
         ${d.parent.y},${d.parent.x}
    `);
      }

      function drawNodes(g, nodes) {
        const node = g.selectAll(".node")
          .data(nodes.descendants())
          .enter().append("g")
          .attr("class", d => `node${d.children ? " node--internal" : " node--leaf"}`)
          .attr("transform", d => `translate(${d.y},${d.x})`);

        node.append("circle")
          .attr("r", 10)
          .attr("class", d => {
            const done = d.data.done ? "toggled" : "";
            const sel = d.data === selectedNodeData ? "selected-node" : "";
            return [done, sel].filter(Boolean).join(" ");
          });

        node.append("text")
          .attr("dy", "-1.3em")
          .attr("x", 0)
          .style("text-anchor", "middle")
          .text(d => d.data.name);
      }

      function update(prebuilt) {
        const { nodes, margin, width, height } = prebuilt || buildHierarchy();
        const g = initializeSVG(margin, width, height);
        if (!selectedNodeData) selectedNodeData = nodes.descendants()[0].data;
        drawLinks(g, nodes);
        drawNodes(g, nodes);
      }

      let toastTimer;
      function showToast(msg, ok) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = `toast ${ok ? 'ok' : 'err'} visible`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.classList.remove('visible'); }, 2000);
      }

      function save() {
        if (!treeData) return;
        fetch('/save?id=' + idParam, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(treeData, null, 2)
        }).then(r => showToast(r.ok ? 'Saved' : 'Error saving', r.ok));
      }

      function fetchTreeData() {
        document.title = idParam;
        fetch('/data/' + idParam + '.json?rand=' + Math.random())
          .then(r => r.json())
          .then(data => { treeData = data; document.title = data.name || idParam; update(); })
          .catch(() => { treeData = { name: "Root", children: [] }; update(); });
      }

      let inverted = false;
      function toggleColors() {
        inverted = !inverted;
        document.body.style.backgroundColor = inverted ? "black" : "white";
        document.body.style.filter = inverted ? "invert(1)" : "invert(0)";
      }

      fetchTreeData();

      window.addEventListener('resize', () => { if (treeData) update(); });

      window.addEventListener('keydown', (event) => {
        if (!treeData) return;

        const built = buildHierarchy();
        const allNodes = built.nodes.descendants();
        if (!selectedNodeData) selectedNodeData = allNodes[0].data;

        const sel = allNodes.find(n => n.data === selectedNodeData) || allNodes[0];
        let dirty = true;
        let dataChanged = false;

        switch (event.key) {
          case 'h':
            if (sel.parent) selectedNodeData = sel.parent.data;
            break;
          case 'l':
            if (sel.children && sel.children.length > 0) selectedNodeData = sel.children[0].data;
            break;
          case 'j': {
            if (sel.parent) {
              const siblings = sel.parent.children;
              const idx = siblings.indexOf(sel);
              if (idx < siblings.length - 1) selectedNodeData = siblings[idx + 1].data;
            }
            break;
          }
          case 'k': {
            if (sel.parent) {
              const siblings = sel.parent.children;
              const idx = siblings.indexOf(sel);
              if (idx > 0) selectedNodeData = siblings[idx - 1].data;
            }
            break;
          }
          case 'i': {
            const name = prompt("New child node name:");
            if (name) {
              if (!sel.data.children) sel.data.children = [];
              sel.data.children.push({ name });
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'o': {
            if (!sel.parent) { alert("Cannot add sibling to root."); dirty = false; break; }
            const name = prompt("New sibling node name:");
            if (name) {
              const parentData = sel.parent.data;
              if (!parentData.children) parentData.children = [];
              const idx = parentData.children.indexOf(sel.data);
              const insertAt = idx === -1 ? parentData.children.length : idx + 1;
              parentData.children.splice(insertAt, 0, { name });
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'r': {
            const newName = prompt("Rename node:", sel.data.name);
            if (newName) { sel.data.name = newName; dataChanged = true; } else { dirty = false; }
            break;
          }
          case 'x': {
            if (!sel.parent) { alert("Cannot delete root node."); dirty = false; break; }
            const parentData = sel.parent.data;
            parentData.children = parentData.children.filter(c => c !== sel.data);
            if (parentData.children.length === 0) delete parentData.children;
            selectedNodeData = sel.parent.data;
            dataChanged = true;
            break;
          }
          case 't':
            sel.data.done = !sel.data.done;
            dataChanged = true;
            break;
          case ' ':
            event.preventDefault();
            sel.data.done = !sel.data.done;
            dataChanged = true;
            break;
          case 's':
            save();
            dirty = false;
            break;
          case 'c':
            toggleColors();
            dirty = false;
            break;
          default:
            dirty = false;
        }

        if (dirty) update(dataChanged ? null : built);
      });
    </script>
  </body>
</html>

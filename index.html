<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap</title>
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      fill: #333;
    }

    .node {
      fill: #fff;
    }

    .node circle {
      stroke: steelblue;
      stroke-width: 3px;
    }

    .node text {
      fill: #333;
      font: 12px sans-serif;
    }

    .link {
      fill: none;
      stroke: #ccc;
      stroke-width: 2px;
    }

    .toggled {
      fill: orange;
    }

    .selected-node {
      stroke: #ff6600 !important;
      stroke-width: 4px !important;
    }

    .collapsed-node {
      stroke-dasharray: 5 3;
    }

    svg {
      width: 99vw;
      height: 99vh;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(0, 0, 0, 0.1) 2px, transparent 2px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.1) 2px, transparent 2px);
      background-size:
        20px 20px,
        20px 20px,
        100px 100px,
        100px 100px;
    }

    .keybindings {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }

    .keybindings table {
      border-collapse: collapse;
    }

    .keybindings td {
      padding: 2px 6px;
    }

    .keybindings kbd {
      display: inline-block;
      padding: 1px 5px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 11px;
    }

    .search-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: none;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 13px;
    }

    .search-bar.visible { display: flex; }

    .search-bar input {
      border: none;
      outline: none;
      font-family: monospace;
      font-size: 13px;
      width: 160px;
    }

    .search-bar .search-count {
      color: #888;
      font-size: 11px;
      min-width: 3em;
    }

    .progress {
      position: fixed;
      top: 10px;
      left: 10px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 6px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #555;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress a {
      color: #007bff;
      text-decoration: none;
      font-size: 11px;
    }

    .progress a:hover { text-decoration: underline; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: white;
      border-radius: 6px;
      padding: 16px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: monospace;
      font-size: 13px;
    }

    .modal label { color: #555; }

    .modal textarea {
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 8px;
      height: 180px;
      outline: none;
    }

    .modal textarea:focus { border-color: #007bff; }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-buttons button {
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: white;
      font-family: monospace;
      cursor: pointer;
    }

    .modal-buttons button.primary {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 13px;
      color: white;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .toast.visible { opacity: 1; }
    .toast.ok  { background: #28a745; }
    .toast.err { background: #dc3545; }
    </style>
  </head>
  <body>
    <svg></svg>
    <div id="searchBar" class="search-bar">
      <span>/</span>
      <input id="searchInput" type="text" autocomplete="off" spellcheck="false">
      <span id="searchCount" class="search-count"></span>
    </div>
    <div id="progress" class="progress">
      <a href="/trees">← all trees</a>
      <span id="progressCount"></span>
    </div>
    <div id="toast" class="toast"></div>
    <div id="keybindings" class="keybindings">
      <table>
        <tr><td><kbd>h</kbd></td><td>go to parent</td></tr>
        <tr><td><kbd>l</kbd></td><td>go to first child</td></tr>
        <tr><td><kbd>j</kbd></td><td>next sibling</td></tr>
        <tr><td><kbd>k</kbd></td><td>prev sibling</td></tr>
        <tr><td><kbd>i</kbd></td><td>insert child</td></tr>
        <tr><td><kbd>o</kbd></td><td>insert sibling below</td></tr>
        <tr><td><kbd>O</kbd></td><td>insert sibling above</td></tr>
        <tr><td><kbd>r</kbd></td><td>rename</td></tr>
        <tr><td><kbd>x</kbd></td><td>delete node</td></tr>
        <tr><td><kbd>-</kbd></td><td>collapse/expand</td></tr>
        <tr><td><kbd>t</kbd></td><td>toggle done</td></tr>
        <tr><td><kbd>u</kbd></td><td>undo</td></tr>
        <tr><td><kbd>U</kbd></td><td>redo</td></tr>
        <tr><td><kbd>/</kbd></td><td>search nodes</td></tr>
        <tr><td><kbd>n</kbd> <kbd>N</kbd></td><td>next/prev match</td></tr>
        <tr><td><kbd>s</kbd></td><td>save</td></tr>
        <tr><td><kbd>c</kbd></td><td>invert colors</td></tr>
        <tr><td><kbd>z</kbd></td><td>reset zoom</td></tr>
        <tr><td><kbd>?</kbd></td><td>toggle this panel</td></tr>
      </table>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
      let treeData;
      let params = new URLSearchParams(window.location.search);
      let idParam = params.get('id');
      let selectedNodeData = null;
      let unsaved = false;
      const collapsed = new Set();
      let searchMatches = [];
      let searchIndex = 0;

      function parseIndentedTree(text) {
        const lines = text.replace(/\t/g, '  ').split('\n')
          .map(line => ({ indent: line.match(/^(\s*)/)[1].length, name: line.trim() }))
          .filter(line => line.name !== '');
        if (lines.length === 0) return [];
        const roots = [];
        const stack = [{ indent: -1, nodeArray: roots }];
        for (const { indent, name } of lines) {
          while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
          const node = { name };
          stack[stack.length - 1].nodeArray.push(node);
          stack.push({ indent, nodeArray: (node.children = []) });
        }
        function clean(node) {
          if (node.children && node.children.length === 0) delete node.children;
          else if (node.children) node.children.forEach(clean);
        }
        roots.forEach(clean);
        return roots;
      }

      function allNodes(root) {
        const result = [];
        function walk(n) { result.push(n); (n.children || []).forEach(walk); }
        walk(root);
        return result;
      }

      function applySearch(term) {
        if (!treeData || !term) { searchMatches = []; return; }
        const lower = term.toLowerCase();
        searchMatches = allNodes(treeData).filter(n => n.name.toLowerCase().includes(lower));
        searchIndex = 0;
        if (searchMatches.length) { selectedNodeData = searchMatches[0]; update(); }
        document.getElementById('searchCount').textContent =
          searchMatches.length ? `1/${searchMatches.length}` : 'no match';
      }

      function cycleSearch(delta) {
        if (!searchMatches.length) return;
        searchIndex = (searchIndex + delta + searchMatches.length) % searchMatches.length;
        selectedNodeData = searchMatches[searchIndex];
        document.getElementById('searchCount').textContent = `${searchIndex + 1}/${searchMatches.length}`;
        update();
      }

      function openSearch() {
        const bar = document.getElementById('searchBar');
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('searchCount').textContent = '';
        searchMatches = [];
        bar.classList.add('visible');
        input.focus();
      }

      function closeSearch() {
        document.getElementById('searchBar').classList.remove('visible');
      }

      document.getElementById('searchInput').addEventListener('input', e => {
        applySearch(e.target.value);
      });

      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeSearch(); e.preventDefault(); }
        else if (e.key === 'Enter') { cycleSearch(1); e.preventDefault(); }
        else if (e.key === 'n') { cycleSearch(1); e.preventDefault(); }
        else if (e.key === 'N') { cycleSearch(-1); e.preventDefault(); }
      });

      const history = [], future = [];

      function nodePath(nodeData, root) {
        function search(cur, path) {
          if (cur === nodeData) return path;
          for (let i = 0; i < (cur.children || []).length; i++) {
            const r = search(cur.children[i], [...path, i]);
            if (r) return r;
          }
          return null;
        }
        return search(root, []) || [];
      }

      function nodeAtPath(root, path) {
        let n = root;
        for (const i of path) {
          if (!n.children || !n.children[i]) return root;
          n = n.children[i];
        }
        return n;
      }

      function snapshot() {
        history.push({
          data: JSON.parse(JSON.stringify(treeData)),
          path: nodePath(selectedNodeData, treeData)
        });
        if (history.length > 100) history.shift();
        future.length = 0;
      }

      function markUnsaved() {
        if (unsaved) return;
        unsaved = true;
        document.title = '* ' + document.title;
      }

      function markSaved() {
        unsaved = false;
        document.title = document.title.replace(/^\* /, '');
      }

      if (!idParam) {
        document.body.innerHTML = '<p style="padding:2rem;font-family:monospace">Missing <code>?id=</code> parameter. Usage: <code>/?id=my-roadmap</code></p>';
        throw new Error('Missing id parameter');
      }

      let zoomBehavior;

      function setupZoom() {
        const svg = d3.select("svg")
          .attr("width", window.innerWidth)
          .attr("height", window.innerHeight);
        svg.append("g").attr("id", "zoom-g");
        zoomBehavior = d3.zoom()
          .scaleExtent([0.05, 4])
          .on("zoom", e => {
            d3.select("#zoom-g").attr("transform", e.transform);
            const { x, y, k } = e.transform;
            const s = `${20*k}px ${20*k}px, ${20*k}px ${20*k}px, ${100*k}px ${100*k}px, ${100*k}px ${100*k}px`;
            const p = `${x}px ${y}px`;
            svg.style("background-size", s).style("background-position", p);
          });
        svg.call(zoomBehavior);
      }

      function initializeSVG(margin) {
        const zoomG = d3.select("#zoom-g");
        zoomG.select("#tree-g").remove();
        return zoomG.append("g")
          .attr("id", "tree-g")
          .attr("transform", `translate(${margin.left},${margin.top})`);
      }

      function buildHierarchy() {
        const margin = { top: 100, right: 200, bottom: 100, left: 200 };
        const width = window.innerWidth - margin.left - margin.right;
        const height = window.innerHeight - margin.top - margin.bottom;
        const treemap = d3.tree().size([height, width]);
        return { nodes: treemap(d3.hierarchy(treeData, d => collapsed.has(d) ? null : d.children)), margin, width, height };
      }

      function drawLinks(g, nodes) {
        g.selectAll(".link")
          .data(nodes.descendants().slice(1))
          .enter().append("path")
          .attr("class", "link")
          .attr("d", d => `
        M${d.y},${d.x}
        C${(d.y + d.parent.y) / 2},${d.x}
         ${(d.y + d.parent.y) / 2},${d.parent.x}
         ${d.parent.y},${d.parent.x}
    `);
      }

      function drawNodes(g, nodes) {
        const node = g.selectAll(".node")
          .data(nodes.descendants())
          .enter().append("g")
          .attr("class", d => `node${d.children ? " node--internal" : " node--leaf"}`)
          .attr("transform", d => `translate(${d.y},${d.x})`);

        node.append("circle")
          .attr("r", 10)
          .attr("class", d => {
            const done = d.data.done ? "toggled" : "";
            const sel = d.data === selectedNodeData ? "selected-node" : "";
            const coll = collapsed.has(d.data) && d.data.children?.length ? "collapsed-node" : "";
            return [done, sel, coll].filter(Boolean).join(" ");
          });

        node.append("text")
          .attr("dy", "-1.3em")
          .attr("x", 0)
          .style("text-anchor", "middle")
          .text(d => d.data.name);

        node.append("text")
          .attr("dy", "2em")
          .attr("x", 0)
          .style("text-anchor", "middle")
          .style("font-size", "9px")
          .style("fill", "#888")
          .text(d => collapsed.has(d.data) && d.data.children?.length ? `+${d.data.children.length}` : "");
      }

      function update(prebuilt) {
        const { nodes, margin } = prebuilt || buildHierarchy();
        const g = initializeSVG(margin);
        if (!selectedNodeData) selectedNodeData = nodes.descendants()[0].data;
        drawLinks(g, nodes);
        drawNodes(g, nodes);

        const all = allNodes(treeData);
        const done = all.filter(n => n.done).length;
        document.getElementById('progressCount').textContent = `${done} / ${all.length} done`;
      }

      let toastTimer;
      function showToast(msg, ok) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = `toast ${ok ? 'ok' : 'err'} visible`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.classList.remove('visible'); }, 2000);
      }

      function save() {
        if (!treeData) return;
        fetch('/save?id=' + idParam, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(treeData, null, 2)
        }).then(r => { if (r.ok) markSaved(); showToast(r.ok ? 'Saved' : 'Error saving', r.ok); });
      }

      function fetchTreeData() {
        document.title = idParam;
        fetch('/data/' + idParam + '.json?rand=' + Math.random())
          .then(r => {
            if (r.status === 404) {
              treeData = { name: idParam, children: [] };
              document.title = idParam;
              showToast('New tree', true);
              update();
              return;
            }
            if (!r.ok) throw new Error(`Server error ${r.status}`);
            return r.json().then(data => {
              treeData = data;
              document.title = data.name || idParam;
              update();
            });
          })
          .catch(err => {
            document.body.insertAdjacentHTML('afterbegin',
              `<p style="position:fixed;top:0;left:0;right:0;padding:0.75rem;background:#dc3545;color:white;font-family:monospace;z-index:9999">
                Failed to load tree: ${err.message}
              </p>`);
          });
      }

      let inverted = false;
      function toggleColors() {
        inverted = !inverted;
        document.body.style.backgroundColor = inverted ? "black" : "white";
        document.body.style.filter = inverted ? "invert(1)" : "invert(0)";
      }

      setupZoom();
      fetchTreeData();

      window.addEventListener('resize', () => {
        d3.select("svg").attr("width", window.innerWidth).attr("height", window.innerHeight);
        if (treeData) update();
      });

      window.addEventListener('keydown', (event) => {
        if (!treeData) return;
        if (document.getElementById('searchBar').classList.contains('visible')) return;

        if (event.key === '/') { event.preventDefault(); openSearch(); return; }
        if (event.key === 'n') { cycleSearch(1); return; }
        if (event.key === 'N') { cycleSearch(-1); return; }

        const built = buildHierarchy();
        const allNodes = built.nodes.descendants();
        if (!selectedNodeData) selectedNodeData = allNodes[0].data;

        const sel = allNodes.find(n => n.data === selectedNodeData) || allNodes[0];
        let dirty = true;
        let dataChanged = false;

        switch (event.key) {
          case 'h':
            if (sel.parent) selectedNodeData = sel.parent.data;
            break;
          case 'l':
            if (sel.children && sel.children.length > 0) selectedNodeData = sel.children[0].data;
            break;
          case 'j': {
            if (sel.parent) {
              const siblings = sel.parent.children;
              const idx = siblings.indexOf(sel);
              if (idx < siblings.length - 1) selectedNodeData = siblings[idx + 1].data;
            }
            break;
          }
          case 'k': {
            if (sel.parent) {
              const siblings = sel.parent.children;
              const idx = siblings.indexOf(sel);
              if (idx > 0) selectedNodeData = siblings[idx - 1].data;
            }
            break;
          }
          case 'i': {
            const name = prompt("New child node name:");
            if (name) {
              snapshot();
              if (!sel.data.children) sel.data.children = [];
              sel.data.children.push({ name });
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'o': {
            if (!sel.parent) { alert("Cannot add sibling to root."); dirty = false; break; }
            const name = prompt("New sibling node name:");
            if (name) {
              snapshot();
              const parentData = sel.parent.data;
              if (!parentData.children) parentData.children = [];
              const idx = parentData.children.indexOf(sel.data);
              const insertAt = idx === -1 ? parentData.children.length : idx + 1;
              parentData.children.splice(insertAt, 0, { name });
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'O': {
            if (!sel.parent) { alert("Cannot add sibling to root."); dirty = false; break; }
            const name = prompt("New sibling node name:");
            if (name) {
              snapshot();
              const parentData = sel.parent.data;
              if (!parentData.children) parentData.children = [];
              const idx = parentData.children.indexOf(sel.data);
              const insertAt = idx === -1 ? 0 : idx;
              parentData.children.splice(insertAt, 0, { name });
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'r': {
            const newName = prompt("Rename node:", sel.data.name);
            if (newName) { snapshot(); sel.data.name = newName; dataChanged = true; } else { dirty = false; }
            break;
          }
          case 'x': {
            if (!sel.parent) { alert("Cannot delete root node."); dirty = false; break; }
            snapshot();
            const parentData = sel.parent.data;
            parentData.children = parentData.children.filter(c => c !== sel.data);
            if (parentData.children.length === 0) delete parentData.children;
            selectedNodeData = sel.parent.data;
            dataChanged = true;
            break;
          }
          case 't':
            snapshot();
            sel.data.done = !sel.data.done;
            dataChanged = true;
            break;
          case ' ':
            event.preventDefault();
            snapshot();
            sel.data.done = !sel.data.done;
            dataChanged = true;
            break;
          case '-': {
            if (sel.data.children?.length) {
              if (collapsed.has(sel.data)) collapsed.delete(sel.data);
              else collapsed.add(sel.data);
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'u': {
            if (history.length > 0) {
              future.push({ data: JSON.parse(JSON.stringify(treeData)), path: nodePath(selectedNodeData, treeData) });
              const prev = history.pop();
              treeData = prev.data;
              selectedNodeData = nodeAtPath(treeData, prev.path);
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 'U': {
            if (future.length > 0) {
              history.push({ data: JSON.parse(JSON.stringify(treeData)), path: nodePath(selectedNodeData, treeData) });
              const next = future.pop();
              treeData = next.data;
              selectedNodeData = nodeAtPath(treeData, next.path);
              dataChanged = true;
            } else { dirty = false; }
            break;
          }
          case 's':
            save();
            dirty = false;
            break;
          case 'c':
            toggleColors();
            dirty = false;
            break;
          case 'z':
            d3.select("svg").call(zoomBehavior.transform, d3.zoomIdentity);
            dirty = false;
            break;
          case '?':
            document.getElementById('keybindings').style.display =
              document.getElementById('keybindings').style.display === 'none' ? '' : 'none';
            dirty = false;
            break;
          default:
            dirty = false;
        }

        if (dataChanged) markUnsaved();
        if (dirty) update(dataChanged ? null : built);
      });

      window.addEventListener('beforeunload', (e) => {
        if (unsaved) e.preventDefault();
      });
    </script>
  </body>
</html>
